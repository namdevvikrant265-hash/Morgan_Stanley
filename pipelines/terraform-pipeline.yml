trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  terraformVersion: '1.9.8'
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/di-b18-infra/environments/prod'
  azureServiceConnection: 'vikserviceconnection'

stages:

# ============================================================
# STAGE 1 - TERRAFORM VALIDATION
# ============================================================

- stage: Validate
  displayName: 'Terraform Validate'

  jobs:
  - job: ValidateTerraform
    displayName: 'Terraform Init & Validate'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    # Install Terraform
    - bash: |
        echo "Installing Terraform $(terraformVersion)..."
        wget -q "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -o "terraform_$(terraformVersion)_linux_amd64.zip" -d /tmp/
        sudo mv /tmp/terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    # Terraform Init
    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd "$(terraformWorkingDirectory)"

          echo "Initializing Terraform..."

          terraform init -input=false

    # Terraform Format
    - bash: |
        cd "$(terraformWorkingDirectory)"

        echo "Checking Terraform formatting..."

        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'

    # Terraform Validate
    - task: AzureCLI@2
      displayName: 'Terraform Validate'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd "$(terraformWorkingDirectory)"

          echo "Validating Terraform configuration..."

          terraform validate


# ============================================================
# STAGE 2 - TERRAFORM PLAN
# ============================================================

- stage: Plan
  displayName: 'Terraform Plan'

  dependsOn: Validate

  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: 'Terraform Plan'

    pool:
      vmImage: 'ubuntu-latest'

    steps:

    - checkout: self

    # Install Terraform
    - bash: |
        echo "Installing Terraform $(terraformVersion)..."
        wget -q "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -o "terraform_$(terraformVersion)_linux_amd64.zip" -d /tmp/
        sudo mv /tmp/terraform /usr/local/bin/
        terraform version
      displayName: 'Install Terraform'

    # Terraform Init
    - task: AzureCLI@2
      displayName: 'Terraform Init'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd "$(terraformWorkingDirectory)"

          echo "Initializing Terraform..."

          terraform init -input=false

    # Terraform Plan
    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          cd "$(terraformWorkingDirectory)"

          echo "Creating Terraform Plan..."

          terraform plan \
            -input=false \
            -var-file="$(terraformWorkingDirectory)/terraform.tfvars" \
            -out="$(Build.ArtifactStagingDirectory)/tfplan"
      env:
        TF_VAR_admin_password: $(TF_VAR_admin_password)

    # Publish Plan
    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/tfplan'
        artifact: 'terraform-plan'


# ============================================================
# STAGE 3 - TERRAFORM APPLY
# ============================================================

- stage: Apply
  displayName: 'Terraform Apply'

  dependsOn: Plan

  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: TerraformApply
    displayName: 'Terraform Apply'

    environment:
      name: terraform-production

    pool:
      vmImage: 'ubuntu-latest'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # Install Terraform
          - bash: |
              echo "Installing Terraform $(terraformVersion)..."
              wget -q "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -o "terraform_$(terraformVersion)_linux_amd64.zip" -d /tmp/
              sudo mv /tmp/terraform /usr/local/bin/
              terraform version
            displayName: 'Install Terraform'

          # Download Plan
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              artifact: 'terraform-plan'
              path: '$(Pipeline.Workspace)/terraform-plan'

          # Terraform Init
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd "$(terraformWorkingDirectory)"

                echo "Initializing Terraform..."

                terraform init -input=false

          # Terraform Apply
          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                cd "$(terraformWorkingDirectory)"

                echo "Applying Terraform Plan..."

                terraform apply \
                  -input=false \
                  -auto-approve \
                  "$(Pipeline.Workspace)/terraform-plan/tfplan"
            env:
              TF_VAR_admin_password: $(TF_VAR_admin_password)